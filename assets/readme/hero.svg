<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DealFlow360</title>
  <desc id="desc">Premium banner for DealFlow360, a self-governing B2B sales operations platform built by Team StackForge for Odoo Hackathon 2026 Finals.</desc>
  <defs>
