<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Deal lifecycle from quote to payment, including the re-approval loop">
  <title>Deal lifecycle — quote, risk, routing, approval, portal counter, re-approval, fulfilment, billing</title>

  <defs>
    <linearGradient id="d-panel" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#12151b"/><stop offset="100%" stop-color="#0a0c11"/>
    </linearGradient>
    <pattern id="d-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#5b7cfa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222a3d"/><stop offset="100%" stop-color="#151a27"/>
    </linearGradient>

    <style>
      @keyframes travel { to { stroke-dashoffset: -1240; } }
      @keyframes loopRun { to { stroke-dashoffset: -220; } }
      @keyframes ride {
        0%   { opacity: 0; offset-distance: 0%; }
        6%   { opacity: 1; }
        94%  { opacity: 1; }
        100% { opacity: 0; offset-distance: 100%; }
      }
      /* Opacity only. These groups are positioned with a transform attribute, and a CSS
         transform would override it and collapse every stage into the top-left corner. */
      @keyframes popIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes throb { 0%,100% { opacity: .25; } 50% { opacity: .7; } }

      .track { stroke-dasharray: 7 7; animation: travel 22s linear infinite; }
      .loopline { stroke-dasharray: 6 6; animation: loopRun 3s linear infinite; }
      .throb { animation: throb 3s ease-in-out infinite; }

      .s1 { animation: popIn .5s ease-out .00s both; }
      .s2 { animation: popIn .5s ease-out .07s both; }
      .s3 { animation: popIn .5s ease-out .14s both; }
      .s4 { animation: popIn .5s ease-out .21s both; }
      .s5 { animation: popIn .5s ease-out .28s both; }
      .s6 { animation: popIn .5s ease-out .35s both; }
      .s7 { animation: popIn .5s ease-out .42s both; }
      .s8 { animation: popIn .5s ease-out .49s both; }

      .lbl  { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

      @media (prefers-reduced-motion: reduce) {
        .track,.loopline,.throb,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8 { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#d-panel)"/>
  <rect width="1200" height="400" rx="16" fill="url(#d-grid)"/>
  <rect width="1200" height="400" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <text class="lbl" x="40" y="44" font-size="17" font-weight="600" fill="#e7e9ee">The deal lifecycle</text>
  <text class="lbl" x="40" y="66" font-size="12.5" fill="#838b9b">Nobody picks an approver. The blended risk score decides the route, and an accepted counter sends it back through on its own.</text>

  <!-- the spine -->
  <line x1="103" y1="196" x2="1097" y2="196" stroke="#2a3145" stroke-width="2"/>
  <line class="track" x1="103" y1="196" x2="1097" y2="196" stroke="#5b7cfa" stroke-width="2" stroke-opacity="0.75"/>

  <!-- ── stages ── -->
  <!-- 1 Quote -->
  <g class="s1" transform="translate(103,196)">
    <circle r="8" fill="#0c0e13" stroke="#5b7cfa" stroke-width="2"/>
    <circle r="3" fill="#5b7cfa"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.10"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e6f2">Quote</text>
      <text class="lbl" x="63" y="45" text-anchor="middle" font-size="10" fill="#838b9b">lines + discounts</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">DRAFT</text>
  </g>

  <!-- 2 Risk -->
  <g class="s2" transform="translate(245,196)">
    <circle r="8" fill="#0c0e13" stroke="#5b7cfa" stroke-width="2"/>
    <circle r="3" fill="#5b7cfa"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#8ea2ff" stroke-opacity="0.35"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e6f2">Risk score</text>
      <text class="mono" x="63" y="45" text-anchor="middle" font-size="9.5" fill="#9aa5c0">revenue-weighted</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">risk.ts</text>
  </g>

  <!-- 3 Routing -->
  <g class="s3" transform="translate(387,196)">
    <circle r="8" fill="#0c0e13" stroke="#e0a132" stroke-width="2"/>
    <circle r="3" fill="#e0a132"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#e0a132" stroke-opacity="0.35"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f3e3c6">Routing</text>
      <text class="lbl" x="63" y="45" text-anchor="middle" font-size="10" fill="#b7a081">auto · mgr · +finance</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">routing.ts</text>
  </g>

  <!-- 4 Approval -->
  <g class="s4" transform="translate(529,196)">
    <circle r="8" fill="#0c0e13" stroke="#e0a132" stroke-width="2"/>
    <circle r="3" fill="#e0a132"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.10"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e6f2">Approval</text>
      <text class="lbl" x="63" y="45" text-anchor="middle" font-size="10" fill="#838b9b">reason required</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">PENDING_*</text>
  </g>

  <!-- 5 Portal -->
  <g class="s5" transform="translate(671,196)">
    <circle r="8" fill="#0c0e13" stroke="#3fcf8e" stroke-width="2"/>
    <circle r="3" fill="#3fcf8e"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#3fcf8e" stroke-opacity="0.35"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d9f5e9">Customer portal</text>
      <text class="lbl" x="63" y="45" text-anchor="middle" font-size="10" fill="#8fb5a8">counters a discount</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">SENT</text>
  </g>

  <!-- 6 Re-approval -->
  <g class="s6" transform="translate(813,196)">
    <circle r="8" fill="#0c0e13" stroke="#e5614b" stroke-width="2"/>
    <circle r="3" fill="#e5614b"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#e5614b" stroke-opacity="0.35"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f7ddd6">Re-approval</text>
      <text class="lbl" x="63" y="45" text-anchor="middle" font-size="10" fill="#c2988e">old steps voided</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">automatic</text>
  </g>

  <!-- 7 Fulfilment -->
  <g class="s7" transform="translate(955,196)">
    <circle r="8" fill="#0c0e13" stroke="#5b7cfa" stroke-width="2"/>
    <circle r="3" fill="#5b7cfa"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.10"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e2e6f2">Fulfilment</text>
      <text class="lbl" x="63" y="45" text-anchor="middle" font-size="10" fill="#838b9b">split · backorder</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">split.ts</text>
  </g>

  <!-- 8 Billing -->
  <g class="s8" transform="translate(1097,196)">
    <circle r="8" fill="#0c0e13" stroke="#3fcf8e" stroke-width="2"/>
    <circle r="3" fill="#3fcf8e"/>
    <g transform="translate(-63,-96)">
      <rect width="126" height="62" rx="9" fill="url(#chip)" stroke="#3fcf8e" stroke-opacity="0.35"/>
      <text class="lbl" x="63" y="26" text-anchor="middle" font-size="12.5" font-weight="600" fill="#d9f5e9">Billing</text>
      <text class="lbl" x="63" y="45" text-anchor="middle" font-size="10" fill="#8fb5a8">one-time + cycles</text>
    </g>
    <text class="mono" x="0" y="34" text-anchor="middle" font-size="9.5" fill="#5f6675">PAID</text>
  </g>

  <!-- the loop back: portal counter re-enters approval -->
  <path class="loopline" d="M671,214 C671,300 560,300 529,300 C502,300 529,240 529,214"
        fill="none" stroke="#e5614b" stroke-opacity="0.65" stroke-width="1.8"/>
  <path d="M671,214 C671,300 560,300 529,300 C502,300 529,240 529,214"
        fill="none" stroke="#e5614b" stroke-opacity="0.14" stroke-width="1.8"/>
  <g transform="translate(600,318)">
    <rect x="-104" y="-15" width="208" height="26" rx="7" fill="#1c1518" stroke="#e5614b" stroke-opacity="0.35"/>
    <text class="lbl" x="0" y="3" text-anchor="middle" font-size="10.5" fill="#e0a99c">accepted counter → back to approval</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,366)">
    <circle cx="6" cy="-4" r="4" fill="#5b7cfa"/>
    <text class="lbl" x="18" y="0" font-size="10.5" fill="#7d859a">engine step</text>
    <circle cx="122" cy="-4" r="4" fill="#e0a132"/>
    <text class="lbl" x="134" y="0" font-size="10.5" fill="#7d859a">needs a human</text>
    <circle cx="252" cy="-4" r="4" fill="#3fcf8e"/>
    <text class="lbl" x="264" y="0" font-size="10.5" fill="#7d859a">money or customer</text>
    <circle cx="400" cy="-4" r="4" fill="#e5614b"/>
    <text class="lbl" x="412" y="0" font-size="10.5" fill="#7d859a">terms changed, route again</text>
  </g>
</svg>
